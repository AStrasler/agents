[project]
name = "yt-design-extractor"
version = "0.1.0"
description = "Extract design tokens (colors, OCR text, transcripts) from YouTube videos"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.7.4",
    "youtube-transcript-api>=0.6.0",
    "pillow==12.3.0+aikido.4",
    "pytesseract>=0.3.10",
    "colorthief>=0.2.1",
]

[project.optional-dependencies]
# EasyOCR pulls in torch (~2 GB). Install with: uv sync --extra easyocr
easyocr = [
    "torch>=2.13.0",
    "torchvision>=0.15",
    "easyocr>=1.7",
]

[[tool.uv.index]]
name = "aikido-pypi-repo"
url = "https://pypi.aikido.io/2a2bb3de4aa2f3a36ee7f"
explicit = true

[tool.uv]
# Dependency-only project — the script (yt-design-extractor.py) is executed via
# `uv run yt-design-extractor.py`, not installed as a package.
package = false

[tool.uv.sources]
pillow = { index = "aikido-pypi-repo" }
